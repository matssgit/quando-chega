version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: quando-chega-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin_password
      POSTGRES_DB: quando_chega
    ports:
      - "5432:5432"
    volumes:
      - quando-chega-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d quando_chega"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  quando-chega-pgdata:
    name: quando-chega-pgdata
